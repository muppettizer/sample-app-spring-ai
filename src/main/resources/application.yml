
spring:
  application:
    name: sample-app-spring-ai
  profiles:
    default: google

  # Spring AI configuration - overridden by e.g spring.profiles.active=google
  ai:
    model:
      chat: none
      memory:
        repository:
          redis:
            host: localhost
            port: 6379

  # DevTools Restart configuration: exclude heavy/static/non-classpath paths from restart
  docker:
    compose:
      lifecycle-management: start-and-stop
      start:
        command: up
      stop:
        command: down
        timeout: 10s
        arguments:
          - "--volumes"
          - "--remove-orphans"

server:
  port: 8081

# WireMock mocks the external Security Holdings API (see compose.yml → wiremock service).
app:
  holdings-api:
    base-url: http://localhost:18089

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true

#app:
#  screening:
#    chat-memory:
#      # in-memory | redis
#      type: in-memory

logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.ai.chat.memory: DEBUG
    org.springframework.ai.model.chat.memory: DEBUG
    org.springframework.ai.model.chat.memory.repository.redis: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG