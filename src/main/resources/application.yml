
spring:
  application:
    name: sample-app-spring-ai
  profiles:
    default: google

  ai:
    model:
      chat: none
  data:
    redis:
      url: redis://127.0.0.1:6379
#      host: localhost
#      port: 6379

server:
  port: 8081

# WireMock mocks the external Security Holdings API (see compose.yml → wiremock service).
app:
  holdings-api:
    base-url: http://localhost:18089

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true

