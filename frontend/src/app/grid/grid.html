<div style="height: 100%; display: flex; flex-direction: column;">
  <div style="margin-bottom: 10px;">
    <input type="text" [(ngModel)]="query" placeholder="Ask AI to filter or sort..." style="width: 300px; padding: 5px;">
    <button class="ask-ai-btn" (click)="askAI()" [disabled]="gridAiService.loading()">
      @if (!gridAiService.loading()) {
        <span>Ask AI</span>
      } @else {
        <span><span class="spinner"></span> Loading...</span>
      }
    </button>
  </div>

  <div style="flex: 1;">
    <ag-grid-angular
      style="width: 100%; height: 100%; border: 1px solid red;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [theme]="theme"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
