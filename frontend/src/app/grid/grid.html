  <div class="grid-panel">

<!--      <button class="ask-ai-btn" (click)="askAI()" [disabled]="gridAiService.loading()">-->

<!--          <span><span class="spinner"></span> Loading...</span>-->
<!--        </ng-template>-->
<!--      </button>-->
<!--    </div>-->

    <div class="preset-row">
      <button class="preset-btn" (click)="runPreset('Find securities with matching Asset Class')">Find similar</button>
      <button class="preset-btn" (click)="runPreset('Show securities with risk score above 70 and sort by risk score descending')">High Risk</button>
      <button class="preset-btn" (click)="runPreset('Show only sanctions flagged securities')">Sanctions Flagged</button>
      <button class="preset-btn" (click)="runPreset('Show securities pending review and hide currency column')">Pending Review</button>
      <button class="preset-btn" (click)="runPreset('Find securities similar to current screening context with better (lower) margin rate and sort by marginRate ascending')">Better Margin</button>
    </div>

    <div class="grid-container">
      <app-custom-button-cell-renderer style="display:none;"></app-custom-button-cell-renderer>
      <ag-grid-angular
        style="width: 100%; height: 100%;"
        [gridOptions]="gridOptions"
        [rowSelection]="rowSelection"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [theme]="theme"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>

  <aside class="chat-panel">
    <div class="chat-header">
      <div>
        <div class="chat-title">Screening AI Chat Assistant</div>
        <div class="chat-subtitle">Portfolio Manager: {{ portfolioManagerId }}</div>
      </div>
      <button class="chat-clear-btn" (click)="clearChatHistory()">Clear</button>
    </div>

    <div class="chat-messages">
      @if (chatMessages.length === 0) {
        <div class="chat-empty">
          Ask about screening rationale, risks, or better-margin alternatives.
        </div>
      }

      @for (chat of chatMessages; track $index) {
        <div
          class="chat-message"
          [class.user]="chat.role === 'user'"
          [class.assistant]="chat.role === 'assistant'"
        >
          <div class="chat-role">
            {{ chat.role === 'user' ? 'You' : 'Assistant' }}
          </div>

          <div class="chat-content" [title]="chat.message">
            {{ chat.message }}
          </div>
        </div>
      }
    </div>

    <div class="chat-input-row">
      <input
        type="text"
        [(ngModel)]="chatInput"
        [disabled]="chatLoading()"
        placeholder="Ask Screening AI..."
        class="chat-input"
        (keyup.enter)="sendScreeningChat()"
      />
      <button class="chat-send-btn" [disabled]="chatLoading() || !chatInput.trim()" (click)="sendScreeningChat()">
        @if (chatLoading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Sending...</span>
        } @else {
          <span>Send</span>
        }
      </button>
    </div>
  </aside>
</div>
