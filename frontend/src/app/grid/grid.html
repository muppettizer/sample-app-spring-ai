<div class="screening-layout">
  <div class="grid-panel">

    <div class="grid-container">
      <app-custom-button-cell-renderer style="display:none;"></app-custom-button-cell-renderer>
      <ag-grid-angular
        style="width: 100%; height: 100%;"
        [gridOptions]="gridOptions"
        [rowSelection]="rowSelection"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [theme]="theme"
        (gridReady)="onGridReady($event)"
        (rowSelected)="onRowSelected($event)">
      </ag-grid-angular>
    </div>
  </div>

  <app-screening-chat
    [portfolioManagerId]="portfolioManagerId"
    [gridApi]="gridApi"
    [selectedRowCount]="selectedRowCount"
    [getStructuredSchemaSafe]="getStructuredSchemaSafe"
    [applyResult]="applyResult.bind(this)">
  </app-screening-chat>
</div>
