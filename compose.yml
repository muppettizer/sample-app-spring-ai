services:

  solr:
    image: solr:9.8.1
    container_name: solr
    ports:
      - "8983:8983"
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx1g
    volumes:
      - solr_data:/var/solr
      - ./web.xml:/opt/solr/server/solr-webapp/webapp/WEB-INF/web.xml
    command: >
      bash -c "
        solr start -cloud -f
        -Dsolr.jetty.request.header.size=65536
        -Dsolr.jetty.filter.allowOrigins=*
        -Dsolr.jetty.filter.allowedMethods=GET,POST,OPTIONS,HEAD
      "
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/solr/admin/collections?action=CLUSTERSTATUS" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cors-checker:
    image: curlimages/curl:latest
    labels:
        - "org.springframework.boot.ignore=true"
    container_name: cors-checker
    depends_on:
      solr:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "
        echo '=== Testing CORS Configuration ===' &&
        echo &&
        echo '1. Testing CORS preflight OPTIONS request:' &&
        curl -i -X OPTIONS -H 'Origin: http://localhost:4200' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: Content-Type' 'http://solr:8983/solr/mycollection/select?q=type%3ALOANS' &&
        echo &&
        echo '2. Testing CORS GET request (similar to your Angular app):' &&
        curl -i -X GET -H 'Origin: http://localhost:4200' 'http://solr:8983/solr/mycollection/select?q=type%3ALOANS&start=0&rows=100&wt=json' &&
        echo &&
        echo '3. Testing basic admin endpoint:' &&
        curl -i -X GET -H 'Origin: http://localhost:4200' 'http://solr:8983/solr/admin/collections?action=LIST' &&
        echo &&
        echo '=== CORS Testing Complete ==='
      "


  solr-init:
    image: curlimages/curl:latest
    labels:
      - "org.springframework.boot.ignore=true"
    depends_on:
      solr:
        condition: service_healthy
    volumes:
      - ./data:/data
    entrypoint:
      - sh
      - -c
      - |
        echo 'Waiting for Solr...'
        until curl -s http://solr:8983/solr/admin/info/system > /dev/null; do
          sleep 5
        done
        echo 'Resetting collection if it exists...'
        curl -s -X POST "http://solr:8983/solr/admin/collections?action=DELETE&name=security-screener" > /dev/null || true
        echo 'Creating collection...'
        curl -X POST "http://solr:8983/solr/admin/collections?action=CREATE&name=security-screener&numShards=1&replicationFactor=1&collection.configName=_default"
        echo 'Disabling auto-create fields...'
        curl -X POST -H "Content-Type: application/json" "http://solr:8983/solr/security-screener/config" -d '{"set-user-property": {"update.autoCreateFields":"false"}}'
        echo 'Ensuring marginRate exists before replace...'
        curl -X POST -H "Content-Type: application/json" "http://solr:8983/solr/security-screener/schema" -d '{"add-field":{"name":"marginRate","type":"pfloat","stored":true,"indexed":true}}'
        echo 'Updating schema...'
        curl -X POST -H "Content-Type: application/json" "http://solr:8983/solr/security-screener/schema" -d @/data/security-screener-schema.json
        echo 'Seeding data...'
        curl -X POST -H "Content-Type: application/json" "http://solr:8983/solr/security-screener/update?commit=true" -d @/data/securities.json
        echo 'Done'
        echo 'Testing collection...'
        curl "http://solr:8983/solr/security-screener/select?q=*:*&rows=2&wt=json"

  wiremock:
    image: wiremock/wiremock:3.12.1
    container_name: wiremock-holdings
    ports:
      - "18089:8080"
    volumes:
      - ./wiremock:/home/wiremock

  redis:
    image: 'redis/redis-stack:7.4.0-v8'
    labels:
      - "org.springframework.boot.service-connection=redis"
    ports:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  solr_data:
  redis_data:
